}

*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font-family:'Hind',system-ui,sans-serif;background:var(--bg);color:var(--ink);line-height:1.6;min-height:100vh;padding-bottom:96px}

button{font-family:inherit}
header.hero{position:relative;text-align:center;padding:64px 20px 44px;background:

  border-bottom:2px dashed var(--line)}
.lang{position:absolute;top:14px;right:16px;display:flex;gap:0;border:1px solid var(--line);border-radius:999px;overflow:hidden;background:var(--card)}
.lang button{border:0;background:transparent;color:var(--muted);padding:6px 14px;cursor:pointer;font-weight:600;font-size:.9rem}
.lang button.on{background:var(--accent);color:#fff}
.bunting{font-size:28px;letter-spacing:6px;margin-bottom:10px}
.hero h1{font-family:'Rozha One',serif;font-size:clamp(2.4rem,8vw,4.6rem);line-height:1.1;color:var(--accent)}
.hero h1 span{color:var(--ink)}
.hero .hi{font-family:'Yatra One',serif;font-size:clamp(1.2rem,4vw,1.8rem);margin-top:6px}
.hero p.sub{max-width:560px;margin:16px auto 8px;color:var(--muted);font-size:1.05rem}
.count{color:var(--muted);font-size:.95rem;margin-bottom:22px}
.btn{display:inline-block;background:var(--accent);color:#fff;padding:12px 26px;border-radius:999px;text-decoration:none;font-weight:600;border:0;cursor:pointer;font-size:1rem}
.btn.ghost{background:transparent;color:var(--accent);border:2px solid var(--accent);margin-left:8px}
.btn:hover{filter:brightness(1.08)}
section{padding:40px 0}
h2{font-family:'Rozha One',serif;font-size:1.9rem;color:var(--accent);margin-bottom:6px}
.lead{color:var(--muted);margin-bottom:22px}
.tools{display:flex;flex-wrap:wrap;gap:12px;align-items:center;margin-bottom:16px}
.chips{display:flex;flex-wrap:wrap;gap:10px;flex:1 1 auto}
.chip{background:var(--chip);color:var(--ink);border:1px solid var(--line);padding:8px 16px;border-radius:999px;cursor:pointer;font-weight:500}
.chip.on{background:var(--accent);color:#fff;border-color:var(--accent)}
.search{flex:0 1 220px;padding:9px 14px;border-radius:999px;border:1px solid var(--line);background:var(--card);color:var(--ink);font:inherit}
.search:focus{outline:2px solid var(--accent)}
.player{position:fixed;right:12px;bottom:84px;width:min(356px,calc(100vw - 24px));height:200px;background:#000;border:1px solid var(--line);border-radius:16px;overflow:hidden;z-index:15;box-shadow:0 10px 30px rgba(0,0,0,.35);transform:translateY(calc(100% + 140px));transition:transform .25s}
body.has-mini .player{transform:none}
body.has-mini{padding-bottom:310px}
@media (min-width:1100px){body.has-mini{padding-bottom:96px}body.has-mini .wrap{max-width:980px;margin:0 400px 0 auto}}
.frame{position:absolute;inset:0;background:#000}
.frame iframe,.frame #yt{position:absolute;inset:0;width:100%;height:100%;border:0}
.hint{color:var(--muted);font-size:.85rem;margin:-10px 0 16px}
.list{display:flex;flex-direction:column;gap:8px}
.row{display:grid;grid-template-columns:28px 96px 1fr auto;gap:12px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:8px 12px 8px 10px;cursor:pointer;transition:transform .12s}
.row:hover{transform:translateX(3px)}
.row.playing{border-color:var(--accent);box-shadow:0 0 0 2px color-mix(in srgb,var(--accent) 35%,transparent)}
.row .n{color:var(--muted);font-size:.85rem;text-align:center}
.row img{width:96px;height:54px;object-fit:cover;border-radius:8px;background:var(--chip);display:block}
.row .info{min-width:0}
.row .t{font-weight:600;line-height:1.3;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .a{color:var(--muted);font-size:.88rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .tag{font-size:.7rem;text-transform:uppercase;letter-spacing:.08em;color:var(--accent);font-weight:600}
.row .go{width:40px;height:40px;border-radius:50%;border:0;background:var(--accent);color:#fff;font-size:1rem;cursor:pointer}
@media (max-width:560px){.row{grid-template-columns:72px 1fr auto}.row .n{display:none}.row img{width:72px;height:41px}}
.moods{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px}
.mood{background:linear-gradient(135deg,var(--chip),var(--card));border:1px solid var(--line);border-radius:16px;padding:20px;cursor:pointer;text-align:left;color:var(--ink)}
.mood:hover{border-color:var(--accent)}
.mood .e{font-size:2rem}
.mood h3{margin:6px 0 4px}
.mood p{color:var(--muted);font-size:.92rem}
.about{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:28px;text-align:center}
.empty{color:var(--muted);padding:20px 0}
footer{text-align:center;padding:30px 20px 40px;color:var(--muted);border-top:2px dashed var(--line);font-size:.92rem}
.keys{margin-top:8px;font-size:.82rem}
kbd{background:var(--chip);border:1px solid var(--line);border-radius:5px;padding:1px 6px;font-family:inherit;font-size:.8rem}
/* bottom bar */
.bar{position:fixed;left:0;right:0;bottom:0;background:var(--bar);border-top:1px solid var(--line);z-index:20;transform:translateY(110%);transition:transform .25s}
.bar.show{transform:none}
.bar .prog{height:5px;background:var(--line);cursor:pointer;position:relative}
.bar .prog i{position:absolute;left:0;top:0;bottom:0;width:0;background:var(--accent)}
.bar .in{max-width:980px;margin:0 auto;padding:8px 16px;display:flex;align-items:center;gap:12px}
.bar img{width:64px;height:36px;object-fit:cover;border-radius:6px;background:var(--chip)}
.bar .meta{min-width:0;flex:1}
.bar .meta .t{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar .meta .a{color:var(--muted);font-size:.82rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar .time{color:var(--muted);font-size:.8rem;white-space:nowrap}
.ctl{display:flex;gap:6px;align-items:center}
.ctl button{width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:var(--chip);color:var(--ink);font-size:1rem;cursor:pointer}
.ctl button.main{background:var(--accent);color:#fff;border-color:var(--accent);width:46px;height:46px}
.ctl button.on{outline:2px solid var(--accent)}
@media (max-width:640px){.bar .time{display:none}.bar img{display:none}.ctl button.opt{display:none}}

.queue{position:fixed;right:0;bottom:0;top:0;width:min(380px,100vw);background:var(--bar);border-left:1px solid var(--line);z-index:30;transform:translateX(105%);transition:transform .25s;display:flex;flex-direction:column}
.queue.show{transform:none}
.queue header{padding:16px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--line)}
.queue h3{font-family:'Rozha One',serif;color:var(--accent);font-size:1.3rem}
.queue .x{border:0;background:var(--chip);color:var(--ink);width:36px;height:36px;border-radius:50%;cursor:pointer;font-size:1rem}
.queue ol{list-style:none;overflow:auto;padding:8px;flex:1}
.queue li{display:flex;gap:10px;align-items:center;padding:8px;border-radius:10px;cursor:pointer}
.queue li:hover{background:var(--chip)}
.queue li.cur{background:var(--chip);outline:1px solid var(--accent)}
.queue li img{width:56px;height:32px;object-fit:cover;border-radius:5px}

.queue li .q1 span{color:var(--muted);font-size:.78rem}

.toast.show{transform:translateX(-50%) translateY(0)}

var lang = "en";
try { lang = localStorage.getItem("mjdv-lang") || (navigator.language && navigator.language.indexOf("hi") === 0 ? "hi" : "en"); } catch(e){}
var MOODS = ["bhoj","har","pun","mar","eng","party"];
var EMOJI = {bhoj:"💃",har:"🥁",pun:"🕺",mar:"🚩",eng:"🎤",party:"🪩"};
var active = "all", cur = -1, ready = false, pending = null, player = null, playing = false, shuffleOn = false, errStreak = 0, term = "";

function $(id){ return document.getElementById(id); }
function tr(){ return T[lang]; }
function esc(s){ return String(s).replace(/[&<>"']/g, function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]; }); }
function thumb(id){ return "https://i.ytimg.com/vi/" + id + "/mqdefault.jpg"; }
function fmt(s){ s = Math.max(0, Math.floor(s || 0)); var m = Math.floor(s/60), r = s % 60; return m + ":" + (r < 10 ? "0" : "") + r; }
function say(msg){ var t = $("toast"); t.textContent = msg; t.classList.add("show"); setTimeout(function(){ t.classList.remove("show"); }, 2600); }

function queue(){
  var q = [], tl = term.trim().toLowerCase();
  songs.forEach(function(s,i){
    if (active !== "all" && s.m !== active) return;
    if (tl && (s.t + " " + s.a).toLowerCase().indexOf(tl) < 0) return;
    q.push(i);
  });
  return q;
}

function applyLang(){
  var d = tr();
  document.documentElement.lang = lang;
  document.querySelectorAll("[data-i]").forEach(function(el){ el.textContent = d[el.getAttribute("data-i")]; });
  document.querySelectorAll("[data-ph]").forEach(function(el){ el.placeholder = d[el.getAttribute("data-ph")]; });
  $("lEn").classList.toggle("on", lang === "en");
  $("lHi").classList.toggle("on", lang === "hi");
  $("count").textContent = songs.length + d.songs;
  renderMoodCards(); renderChips(); renderList(); renderQueue();
}
function renderMoodCards(){
  var d = tr();
  $("moodCards").innerHTML = MOODS.map(function(k){
    return '<button class="mood" data-m="' + k + '"><div class="e">' + EMOJI[k] + '</div><h3>' + esc(d.moodNames[k]) + '</h3><p>' + esc(d.moodDesc[k]) + '</p></button>';
  }).join("");
}
function renderChips(){
  var d = tr(), h = '<button class="chip' + (active === "all" ? " on" : "") + '" data-m="all">' + esc(d.all) + '</button>';
  MOODS.forEach(function(k){ h += '<button class="chip' + (active === k ? " on" : "") + '" data-m="' + k + '">' + esc(d.moodNames[k]) + '</button>'; });
  $("chips").innerHTML = h;
}
function renderList(){
  var q = queue(), d = tr();
  $("list").innerHTML = q.map(function(i, n){
    var s = songs[i];
    return '<div class="row' + (i === cur ? " playing" : "") + '" data-i="' + i + '"><div class="n">' + (n + 1) + '</div><img loading="lazy" src="' + thumb(s.id) + '" alt=""><div class="info"><div class="tag">' + esc(d.moodNames[s.m]) + '</div><div class="t">' + esc(s.t) + '</div><div class="a">' + esc(s.a) + '</div></div><button class="go" data-i="' + i + '" aria-label="Play ' + esc(s.t) + '">' + (i === cur && playing ? "❚❚" : "▶") + '</button></div>';
  }).join("");
  $("empty").hidden = q.length > 0;
}
function renderQueue(){
  var q = queue(), pos = q.indexOf(cur), order = [];
  if (pos >= 0) { for (var k = 0; k < q.length; k++) order.push(q[(pos + k) % q.length]); } else { order = q; }
  $("qList").innerHTML = order.map(function(i){
    var s = songs[i];
    return '<li data-i="' + i + '" class="' + (i === cur ? "cur" : "") + '"><img loading="lazy" src="' + thumb(s.id) + '" alt=""><div class="q1"><b>' + esc(s.t) + '</b><span>' + esc(s.a) + '</span></div></li>';
  }).join("");
}
function updateUI(){
  var s = cur >= 0 ? songs[cur] : null;
  $("bar").classList.toggle("show", !!s);
  document.body.classList.toggle("has-mini", !!s);
  if (s) {
    $("bImg").src = thumb(s.id); $("bT").textContent = s.t; $("bA").textContent = s.a;
    document.title = (playing ? "▶ " : "") + s.t + " · Mishra ji Desi vibe";
  } else { document.title = "Mishra ji Desi vibe"; }
  $("pp").textContent = playing ? "❚❚" : "▶";
  $("shufBtn").classList.toggle("on", shuffleOn);
  renderList(); renderQueue();
}

function playSong(i, scroll){
  cur = i; playing = true;
  if (ready && player) { player.loadVideoById(songs[i].id); } else { pending = i; }
  updateUI();
}
function step(dir){
  var q = queue();
  if (!q.length) return;
  var pos = q.indexOf(cur), n;
  if (shuffleOn && q.length > 1) { do { n = q[Math.floor(Math.random() * q.length)]; } while (n === cur); }
  else if (pos < 0) { n = q[0]; }
  else { n = q[(pos + dir + q.length) % q.length]; }
  playSong(n, false);
}
function toggle(){
  if (cur < 0) { var q = queue(); if (q.length) playSong(q[0], false); return; }
  if (ready && player) { if (playing) player.pauseVideo(); else player.playVideo(); }
}
function seek(delta){
  if (!ready || !player || cur < 0) return;
  try { player.seekTo(Math.max(0, player.getCurrentTime() + delta), true); } catch(e){}
}
function songLink(i){ return location.origin + location.pathname + "?s=" + songs[i].id; }

window.onYouTubeIframeAPIReady = function(){
  player = new YT.Player("yt", {
    width:"100%", height:"100%",
    playerVars:{ rel:0, playsinline:1, modestbranding:1 },
    events:{
      onReady:function(){
        ready = true;
        if (pending !== null) { player.loadVideoById(songs[pending].id); pending = null; }
        else if (cur >= 0) { player.cueVideoById(songs[cur].id); }
      },
      onStateChange:function(e){
        if (e.data === 1) { playing = true; errStreak = 0; updateUI(); }
        else if (e.data === 2) { playing = false; updateUI(); }
        else if (e.data === 0) { step(1); }
      },
      onError:function(){
        errStreak++;
        if (errStreak > 3) { playing = false; updateUI(); say(tr().fail); return; }
        say(tr().skip); step(1);
      }
    }
  });
};
var tag = document.createElement("script");
tag.src = "https://www.youtube.com/iframe_api";
document.head.appendChild(tag);

setInterval(function(){
  if (!ready || !player || cur < 0) return;
  try {
    var c = player.getCurrentTime(), d = player.getDuration();
    $("progFill").style.width = d > 0 ? (c / d * 100) + "%" : "0%";
    $("bTime").textContent = fmt(c) + " / " + fmt(d);
  } catch(e){}
}, 500);
$("prog").addEventListener("click", function(e){
  if (!ready || !player || cur < 0) return;
  var r = this.getBoundingClientRect();
  try { player.seekTo(player.getDuration() * ((e.clientX - r.left) / r.width), true); } catch(x){}
});

function setMood(m){ active = m; renderChips(); renderList(); renderQueue(); }
$("chips").addEventListener("click", function(e){ var b = e.target.closest("[data-m]"); if (b) setMood(b.getAttribute("data-m")); });
$("moodCards").addEventListener("click", function(e){ var b = e.target.closest("[data-m]"); if (!b) return; setMood(b.getAttribute("data-m")); $("songs").scrollIntoView({behavior:"smooth"}); });
$("list").addEventListener("click", function(e){
  var row = e.target.closest(".row"); if (!row) return;
  var i = parseInt(row.getAttribute("data-i"), 10);
  if (i === cur) toggle(); else playSong(i, true);
});
$("qList").addEventListener("click", function(e){ var li = e.target.closest("li"); if (li) playSong(parseInt(li.getAttribute("data-i"), 10), false); });
$("search").addEventListener("input", function(){ term = this.value; renderList(); renderQueue(); });
$("pp").onclick = toggle;
$("next").onclick = function(){ step(1); };
$("prev").onclick = function(){ step(-1); };
$("shufBtn").onclick = function(){ shuffleOn = !shuffleOn; updateUI(); say(shuffleOn ? tr().shufOn : tr().shufOff); };
$("qBtn").onclick = function(){ $("queue").classList.toggle("show"); };
$("qClose").onclick = function(){ $("queue").classList.remove("show"); };
$("start").onclick = function(){ var q = queue(); if (q.length) playSong(q[0], true); };
$("shuffle").onclick = function(){ var q = queue(); if (q.length) playSong(q[Math.floor(Math.random() * q.length)], true); };
function copyOrShare(url, text){
  var data = { title:"Mishra ji Desi vibe", text:text, url:url };
  if (navigator.share) { navigator.share(data).catch(function(){}); }
  else if (navigator.clipboard) { navigator.clipboard.writeText(url).then(function(){ say(tr().linkCopied); }); }
}
$("share").onclick = function(){ copyOrShare(location.origin + location.pathname, "Purane Bhojpuri geet and party hits, one tap away. Come ride the vibe!"); };
$("shareSong").onclick = function(){ if (cur >= 0) copyOrShare(songLink(cur), songs[cur].t + " on Mishra ji Desi vibe"); };
$("lEn").onclick = function(){ lang = "en"; try { localStorage.setItem("mjdv-lang", lang); } catch(e){} applyLang(); updateUI(); };
$("lHi").onclick = function(){ lang = "hi"; try { localStorage.setItem("mjdv-lang", lang); } catch(e){} applyLang(); updateUI(); };

document.addEventListener("keydown", function(e){
  if (e.ctrlKey || e.metaKey || e.altKey) return;
  var tgt = e.target, typing = tgt && (tgt.tagName === "INPUT" || tgt.tagName === "TEXTAREA");
  if (e.key === "/" && !typing) { e.preventDefault(); $("search").focus(); return; }
  if (e.key === "Escape") { $("queue").classList.remove("show"); if (typing) tgt.blur(); return; }
  if (typing) return;
  var k = e.key.toLowerCase();
  if (e.key === " ") { if (tgt && tgt.tagName === "BUTTON") return; e.preventDefault(); toggle(); }
  else if (k === "n") step(1);
  else if (k === "p") step(-1);
  else if (k === "s") { shuffleOn = !shuffleOn; updateUI(); say(shuffleOn ? tr().shufOn : tr().shufOff); }
  else if (k === "q") $("queue").classList.toggle("show");
  else if (e.key === "ArrowRight") seek(10);
  else if (e.key === "ArrowLeft") seek(-10);
});

applyLang();
try {
  var sp = new URLSearchParams(location.search).get("s");
  if (sp) { for (var z = 0; z < songs.length; z++) { if (songs[z].id === sp) { cur = z; pending = null; updateUI(); break; } } }
} catch(e){}
updateUI();
